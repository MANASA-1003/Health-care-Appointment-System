<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>User Dashboard</title>

    <link rel="stylesheet"
          href="../css/style.css">

</head>


<body>

<div class="dashboard">


    <aside class="sidebar">

        <h2>HealthCare+</h2>

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="doctors.html">
            Doctors
        </a>

        <a href="book.html">
            Book Appointment
        </a>

        <a href="appointments.html">
            My Appointments
        </a>

        <a href="#" onclick="logout()">
            Logout
        </a>

    </aside>


    <main class="main">

        <h1>
            Welcome,
            <span id="userName"></span>!
        </h1>

        <p>
            Manage your healthcare appointments
            easily.
        </p>


        <div class="dashboard-cards">


            <div class="dashboard-card">

                <h3>Find Doctors</h3>

                <p>
                    View available doctors.
                </p>

                <br>

                <a
                    href="doctors.html"
                    class="btn">

                    View Doctors

                </a>

            </div>


            <div class="dashboard-card">

                <h3>Book Appointment</h3>

                <p>
                    Book an appointment with
                    a doctor.
                </p>

                <br>

                <a
                    href="book.html"
                    class="btn">

                    Book Now

                </a>

            </div>


            <div class="dashboard-card">

                <h3>My Appointments</h3>

                <p>
                    View your appointments.
                </p>

                <br>

                <a
                    href="appointments.html"
                    class="btn">

                    View

                </a>

            </div>


        </div>

    </main>

</div>


<script src="../js/user.js"></script>

</body>

</html>
