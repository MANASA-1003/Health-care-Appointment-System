<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Appointments</title>

    <link rel="stylesheet"
          href="../css/style.css">

</head>


<body>

<div class="dashboard">


    <aside class="sidebar">

        <h2>HealthCare+</h2>

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="doctors.html">
            Doctors
        </a>

        <a href="book.html">
            Book Appointment
        </a>

        <a href="appointments.html">
            My Appointments
        </a>

        <a href="#" onclick="logout()">
            Logout
        </a>

    </aside>


    <main class="main">

        <h1>My Appointments</h1>

        <div id="appointmentList"></div>

    </main>

</div>


<script src="../js/user.js"></script>


<script>

function displayAppointments() {

    let appointments =
        JSON.parse(
            localStorage.getItem(
                "appointments"
            )
        ) || [];


    let myAppointments =
        appointments.filter(
            function(appointment) {

                return (
                    appointment.email ===
                    currentUser.email
                );

            }
        );


    let list =
        document.getElementById(
            "appointmentList"
        );


    if (
        myAppointments.length === 0
    ) {

        list.innerHTML =
            "<p>No appointments found.</p>";

        return;
    }


    let html = `

        <table>

            <tr>

                <th>Doctor</th>

                <th>Date</th>

                <th>Time</th>

                <th>Status</th>

                <th>Action</th>

            </tr>

    `;


    myAppointments.forEach(
        function(appointment) {

            html += `

                <tr>

                    <td>
                        ${appointment.doctor}
                    </td>

                    <td>
                        ${appointment.date}
                    </td>

                    <td>
                        ${appointment.time}
                    </td>

                    <td>
                        ${appointment.status}
                    </td>

                    <td>

                        <button
                            onclick="
                            cancelAppointment(
                                ${appointment.id}
                            )">

                            Cancel

                        </button>

                    </td>

                </tr>

            `;

        }
    );


    html += "</table>";


    list.innerHTML = html;

}



// Cancel appointment

function cancelAppointment(id) {

    let appointments =
        JSON.parse(
            localStorage.getItem(
                "appointments"
            )
        ) || [];


    appointments =
        appointments.filter(
            function(appointment) {

                return appointment.id !== id;

            }
        );


    localStorage.setItem(
        "appointments",
        JSON.stringify(
            appointments
        )
    );


    alert(
        "Appointment cancelled!"
    );


    displayAppointments();

}


displayAppointments();

</script>

</body>

</html>
