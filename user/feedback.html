<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Feedback</title>

    <link rel="stylesheet"
          href="../css/style.css">

</head>

<body>

<div class="dashboard">

    <aside class="sidebar">

        <h2>HealthCare+</h2>

        <a href="dashboard.html">🏠 Dashboard</a>

        <a href="doctors.html">👨‍⚕️ Doctors</a>

        <a href="book.html">📅 Book Appointment</a>

        <a href="appointments.html">📋 My Appointments</a>

        <a href="feedback.html">⭐ Feedback</a>

        <a href="../index.html"
           onclick="logout()">
            🚪 Logout
        </a>

    </aside>


    <main class="main-content">

        <div class="form-container"
             style="margin:0;max-width:700px;">

            <h2>Share Your Feedback</h2>


            <div class="form-group">

                <label>Rating</label>

                <select id="rating">

                    <option value="">
                        Select Rating
                    </option>

                    <option value="5">
                        ⭐⭐⭐⭐⭐ Excellent
                    </option>

                    <option value="4">
                        ⭐⭐⭐⭐ Very Good
                    </option>

                    <option value="3">
                        ⭐⭐⭐ Good
                    </option>

                    <option value="2">
                        ⭐⭐ Average
                    </option>

                    <option value="1">
                        ⭐ Poor
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>Your Feedback</label>

                <textarea
                    id="message"
                    placeholder="Write your feedback here..."></textarea>

            </div>


            <button
                class="btn"
                onclick="submitFeedback()">

                Submit Feedback

            </button>

        </div>

    </main>

</div>


<script src="../js/auth.js"></script>

<script src="../js/user.js"></script>

</body>

</html>
