<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HealthCare+ | Login</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<header>

    <div class="logo">
        HealthCare+
    </div>

    <nav>

        <a href="index.html">Home</a>

        <a href="signup.html">Signup</a>

    </nav>

</header>


<div class="form-container">

    <h2>Login</h2>

    <div class="form-group">

        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter email">

    </div>


    <div class="form-group">

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter password">

    </div>


    <button
        class="btn"
        onclick="login()">

        Login

    </button>


    <p style="margin-top:20px;text-align:center;">

        New user?
        <a href="signup.html">
            Create an account
        </a>

    </p>

</div>


<script src="js/auth.js"></script>

</body>

</html>
